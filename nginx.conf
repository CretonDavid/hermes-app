# Limitation des tentatives sur les routes d'authentification, par adresse IP (en plus de l'API)
limit_req_zone $binary_remote_addr zone=hermes_auth:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Pas de version de nginx dans les en-têtes ni les pages d'erreur
    server_tokens off;

    # Imports de relevés jusqu'à 10 Mo, comme côté API
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # DNS de Docker, réinterrogé régulièrement : l'API peut changer d'adresse en redémarrant
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    # Les en-têtes de sécurité sont répétés dans chaque bloc location : nginx n'hérite pas des
    # add_header du niveau supérieur dès qu'un bloc en déclare un
    include /etc/nginx/snippets/security-headers.conf;

    location /api/auth/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=hermes_auth burst=10 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # /api/... est transmis à l'API sans le préfixe
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Fichiers générés avec un hash dans le nom : cache long
    location ~* \.(?:js|css|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        expires 1y;
        try_files $uri =404;
    }

    # Script de thème chargé avant l'application, sans hash dans son nom
    location = /theme-init.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Application monopage : toute autre route renvoie index.html, jamais mis en cache
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

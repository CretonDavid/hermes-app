server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Imports de relevés jusqu'à 10 Mo, comme côté API
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # /api/... est transmis à l'API sans le préfixe
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Fichiers générés avec un hash dans le nom : cache long
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application monopage : toute autre route renvoie index.html, jamais mis en cache
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

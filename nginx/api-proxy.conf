# Relais vers l'API, inclus par les blocs location /api de nginx.conf.
proxy_pass $api;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
# Remplace (et non complète) l'en-tête reçu : un client ne peut pas se faire passer pour une autre adresse
proxy_set_header X-Forwarded-For $remote_addr;
# Jamais transmis : Tomcat en déduirait le port 80 au lieu du port réel, et l'origine de la page ne
# correspondrait plus à celle de la requête (refus CORS en 403)
proxy_set_header X-Forwarded-Proto "";
proxy_read_timeout 120s;

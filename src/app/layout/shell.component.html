<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="brand">
      <span class="logo"><mat-icon>account_balance_wallet</mat-icon></span>
      <span>Hermès</span>
    </div>

    <span
      class="new-button-wrapper"
      [matTooltip]="store.openAccounts().length === 0 ? 'Créez d’abord un compte' : ''"
    >
      <button
        matButton="filled"
        class="new-button"
        (click)="newTransaction()"
        [disabled]="store.openAccounts().length === 0"
      >
        <mat-icon>add</mat-icon>
        Nouvelle opération
      </button>
    </span>

    <mat-nav-list>
      @for (item of navigation; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          [activated]="rla.isActive"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    @if (store.openAccounts().length > 0) {
      <div class="accounts-title">Mes comptes</div>
      <div class="accounts">
        @for (account of store.openAccounts(); track account.id) {
          <a
            class="account-link"
            [routerLink]="['/accounts', account.id]"
            routerLinkActive="active"
          >
            <span class="name" [title]="account.name">{{ account.name }}</span>
            <span class="amount" [class.negative]="account.balance < 0">
              {{ account.balance | money: account.currency.code }}
            </span>
          </a>
        }
      </div>
    }

    <div class="spacer"></div>
    <div class="footer">
      <button matButton class="logout" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Se déconnecter
      </button>
      <button
        matIconButton
        class="theme-toggle"
        (click)="theme.toggle()"
        [matTooltip]="theme.isDark() ? 'Passer au thème clair' : 'Passer au thème sombre'"
        [attr.aria-label]="theme.isDark() ? 'Passer au thème clair' : 'Passer au thème sombre'"
      >
        <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
